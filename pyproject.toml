[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-iam-policy-simulator"
version = "0.1.0"
description = "Offline OCI IAM policy statement simulator: allow/deny answers plus risky-grant findings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-iam-policy-simulator = "oci_iam_policy_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
